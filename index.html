<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple web page deployed through a Jenkins, Docker and Kubernetes CI/CD pipeline.">
  <title>Jenkins CI/CD Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f2f5f9; color: #152238; }
    main { width: min(720px, 100%); padding: clamp(28px, 6vw, 56px); border: 1px solid #dce4ef; border-radius: 22px; background: #fff; box-shadow: 0 18px 55px rgba(22, 42, 72, .08); }
    .eyebrow { color: #2865b8; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(2rem, 6vw, 3.3rem); line-height: 1.08; }
    p { color: #526177; font-size: 1.05rem; line-height: 1.7; }
    .flow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .flow span { padding: 9px 13px; border: 1px solid #d8e2ef; border-radius: 999px; color: #29415f; background: #f7f9fc; font-size: .9rem; font-weight: 600; }
    footer { margin-top: 30px; color: #77869a; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Deployment successful</div>
    <h1>Hello from my CI/CD pipeline.</h1>
    <p>This sample Nginx website is packaged as a Docker image, published to Docker Hub by Jenkins, and deployed to Kubernetes.</p>
    <div class="flow" aria-label="Delivery stages">
      <span>GitHub</span><span>Jenkins</span><span>Docker</span><span>Docker Hub</span><span>Kubernetes</span>
    </div>
    <footer>Demo application · Jenkins + Docker + Kubernetes</footer>
  </main>
</body>
</html>
